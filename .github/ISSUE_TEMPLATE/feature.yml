name: Feature
description: New functionality (maps to a milestone issue in the roadmap)
title: '<short imperative summary>'
labels:
  - type:feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Add the matching area:* label after creating the issue.
      options:
        - auth
        - user
        - catalog
        - inventory
        - cart
        - order
        - payment
        - notification
        - gateway
        - bff
        - shared
        - infra
        - observability
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be built
      description: One or two sentences. Link related issues/ADRs if any.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
